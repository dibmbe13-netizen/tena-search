<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Change password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
  </head>
  <body>
    <div id="nav"></div>
    <div class="container py-5" style="max-width:460px">
      <h1 class="h3 mb-3">Change password</h1>
      <div id="ok" class="alert alert-success d-none">Password changed. Your other devices were logged out.</div>
      <div id="err" class="alert alert-danger d-none"></div>
      <form id="f">
        <div class="mb-3">
          <label class="form-label" for="cur">Current password</label>
          <div class="input-group">
            <input id="cur" type="password" autocomplete="current-password" class="form-control" required>
            <button type="button" id="t1" class="btn btn-outline-secondary" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new">New password</label>
          <div class="input-group">
            <input id="new" type="password" minlength="8" maxlength="72" autocomplete="new-password" class="form-control" required>
            <button type="button" id="t2" class="btn btn-outline-secondary" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <div class="form-text">At least 8 characters.</div></div>
          <div class="mb-3">
            <label class="form-label" for="new2">Repeat new password</label>
            <div class="input-group">
              <input id="new2" type="password" minlength="8" maxlength="72" autocomplete="new-password" class="form-control" required>
            <button type="button" id="t3" class="btn btn-outline-secondary" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>
          <button class="btn btn-primary w-100" id="save">Change password</button>
      </form>
    </div>
    <script>
      requireLogin();
      const $ = id => document.getElementById(id);
      wirePasswordToggle("cur", "t1"); wirePasswordToggle("new", "t2"); wirePasswordToggle("new2", "t3");
      const fail = msg => { $("err").textContent = msg; $("err").classList.remove("d-none"); $("ok").classList.add("d-none"); };

      $("f").addEventListener("submit", async e => {
        e.preventDefault();
        if ($("new").value !== $("new2").value) return fail("The two new passwords do not match.");
        $("save").disabled = true;
        const res = await fetch("/api/auth/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_password: $("cur").value, new_password: $("new").value })
        });
        const data = await res.json();
        $("save").disabled = false;
        if (res.status === 401) { location = "login.html"; return; }
        if (!res.ok) return fail(data.error);
        $("err").classList.add("d-none"); $("ok").classList.remove("d-none");
        $("f").reset();
      });
    </script>
    <div id="foot"></div>
  </body>
</html>
