<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-4">
 <h1 class="h3 mb-3">Admin</h1>
 <div class="row g-3 mb-3" id="stats"></div>
 <div class="card mb-4"><div class="card-body">
  <h2 class="h6">Data freshness (approved hospitals)</h2>
  <div class="progress mb-2" style="height:1.25rem" id="bar"></div>
  <div class="small text-muted" id="legend"></div>
 </div></div>
 <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h2 class="h5 mb-0">Hospitals</h2>
  <div class="btn-group" id="filters">
   <button class="btn btn-outline-secondary" data-s="all">All</button>
   <button class="btn btn-outline-secondary" data-s="pending">Pending</button>
   <button class="btn btn-outline-secondary" data-s="approved">Approved</button>
   <button class="btn btn-outline-secondary" data-s="rejected">Rejected</button>
  </div>
 </div>
 <div class="table-responsive"><table class="table bg-white align-middle">
  <thead><tr><th>Hospital</th><th>Status</th><th>Updated</th><th>Emergency</th><th>Services</th><th>Staff email</th><th></th></tr></thead>
  <tbody id="rows"></tbody></table></div>
 <p id="empty" class="text-muted d-none">No hospitals in this list.</p>
</div>
<script>
 requireRole("admin");
 const $ = id => document.getElementById(id);
 let filter = sessionStorage.getItem("adminFilter") || "pending";
 const BADGE = { pending: "warning", approved: "success", rejected: "secondary" };

 const stat = (label, value, note = "") => `<div class="col-6 col-md-3"><div class="card h-100"><div class="card-body">
  <div class="text-muted small">${label}</div><div class="fs-2 fw-bold">${value}</div><div class="small text-muted">${note}</div></div></div></div>`;

 async function loadStats() {
  const res = await fetch("/api/admin/stats");
  if (!res.ok) return;
  const s = await res.json();
  $("stats").innerHTML =
   stat("Hospitals", s.hospitals.total, `${s.hospitals.approved} approved, ${s.hospitals.pending} pending, ${s.hospitals.rejected} rejected`) +
   stat("Users", s.users.hospital_staff + s.users.admins, `${s.users.hospital_staff} hospital staff, ${s.users.admins} admin`) +
   stat("Emergency open now", s.live.emergency_open, "approved hospitals") +
   stat("Services listed", s.services_listed, "across approved hospitals");
  const total = s.live.fresh + s.live.stale + s.live.unpublished || 1;
  const seg = (n, cls) => n ? `<div class="progress-bar bg-${cls}" style="width:${n / total * 100}%">${n}</div>` : "";
  $("bar").innerHTML = seg(s.live.fresh, "success") + seg(s.live.stale, "danger") + seg(s.live.unpublished, "secondary");
  $("legend").textContent = `${s.live.fresh} updated in the last 12 hours, ${s.live.stale} outdated, ${s.live.unpublished} not published yet`;
 }

 async function loadList() {
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b.dataset.s === filter));
  const res = await fetch("/api/admin/hospitals?status=" + filter);
  if (!res.ok) return;
  const list = await res.json();
  $("rows").innerHTML = list.map(h => `<tr>
   <td><strong>${esc(h.name)}</strong>
    <div class="small text-muted">${esc(h.address)}, ${esc(h.city)}</div>
    <div class="small text-muted">${esc(h.phone)}${h.ambulance_phone ? ", ambulance " + esc(h.ambulance_phone) : ""}${h.lat == null ? ", no location" : ""}</div></td>
   <td><span class="badge text-bg-${BADGE[h.status]}">${esc(h.status)}</span></td>
   <td>${h.last_updated ? freshBadge(h.last_updated) : '<span class="text-muted small">Never</span>'}</td>
   <td>${h.emergency_open ? "Open" : "Closed"}</td>
   <td>${h.service_count}</td>
   <td class="small">${esc(h.email)}</td>
   <td class="text-end text-nowrap">
    ${h.status !== "approved" ? `<button class="btn btn-sm btn-primary" onclick="decide(${h.id}, 'approved')">Approve</button>` : ""}
    ${h.status !== "rejected" ? `<button class="btn btn-sm btn-outline-danger" onclick="decide(${h.id}, 'rejected')">Reject</button>` : ""}
   </td></tr>`).join("");
  $("empty").classList.toggle("d-none", list.length > 0);
 }

 async function decide(id, status) {
  if (status === "rejected" && !confirm("Reject this hospital? It disappears from the public site and its staff are locked out.")) return;
  await fetch(`/api/admin/hospitals/${id}/status`, {
   method: "PUT",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify({ status })
  });
  loadStats(); loadList();
 }

 document.querySelectorAll("#filters button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.s; sessionStorage.setItem("adminFilter", filter); loadList(); }));
 loadStats(); loadList();
</script>
<div id="foot"></div></body></html>
