<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Hospital dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-4" style="max-width:720px">
 <div class="d-flex flex-wrap justify-content-between gap-2 mb-2"><h1 class="h3" id="name">Dashboard</h1><span id="badge"></span></div>
 <div id="warn" class="alert alert-warning d-none">Your data is missing or more than 12 hours old. Please update it now.</div>
 <div id="saved" class="alert alert-success d-none">Update saved.</div>
 <div id="failed" class="alert alert-danger d-none"></div>
 <div class="card mb-3"><div class="card-body">
  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="er"><label class="form-check-label fw-semibold" for="er">Emergency care is open</label></div>
  <h2 class="h6">Services available today</h2><div id="svc"></div>
 </div></div>
 <div class="row g-3 mb-3">
  <div class="col-md-6"><label class="form-label" for="ph">Phone</label><input id="ph" class="form-control"></div>
  <div class="col-md-6"><label class="form-label" for="am">Ambulance phone</label><input id="am" class="form-control"></div>
 </div>
 <div class="row g-3 mb-3">
  <div class="col-md-6"><label class="form-label" for="lat">Latitude</label><input id="lat" type="number" step="any" min="-90" max="90" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label" for="lng">Longitude</label><input id="lng" type="number" step="any" min="-180" max="180" class="form-control" required></div>
  <div class="col-12"><button type="button" id="loc" class="btn btn-outline-secondary btn-sm">Fill from this device's location</button> <span id="locmsg" class="small text-muted">Or in Google Maps, right-click your hospital and click the two numbers. Latitude is the first one.</span></div>
 </div>
 <button id="save" class="btn btn-primary btn-lg w-100">Save and confirm update</button>
 <p class="small text-muted mt-2">Press this even if nothing changed, so users know the data is current.</p>
</div>
<script>
 requireRole("hospital");
 let h;
 const $ = id => document.getElementById(id);
 function show() {
  $("badge").innerHTML = h.last_updated ? freshBadge(h.last_updated) : '<span class="fresh fresh-red">Not published yet</span>';
  $("warn").classList.toggle("d-none", !!h.last_updated && hoursSince(h.last_updated) < 12);
 }
 api.dashboard().then(x => {
  if (!x) { $("failed").textContent = "Your hospital is not approved at the moment. Please contact the admin."; $("failed").classList.remove("d-none"); return; }
  h = x;
  $("name").textContent = h.name;
  $("er").checked = h.emergency_open;
  $("ph").value = h.phone || "";
  $("am").value = h.ambulance_phone || "";
  $("lat").value = h.lat ?? "";
  $("lng").value = h.lng ?? "";
  // the Emergency switch at the top controls the "Emergency" service
  $("svc").innerHTML = ALL_SERVICES.filter(s => s !== "Emergency").map(s => `<div class="form-check form-switch">
   <input class="form-check-input svc" type="checkbox" id="s-${s}" value="${s}" ${h.services.includes(s) ? "checked" : ""}>
   <label class="form-check-label" for="s-${s}">${s}</label></div>`).join("");
  show();
 });
 $("save").addEventListener("click", async () => {
  const btn = $("save");
  btn.disabled = true; btn.textContent = "Saving...";
  $("saved").classList.add("d-none"); $("failed").classList.add("d-none");
  const res = await api.saveDashboard({
   emergency_open: $("er").checked,
   phone: $("ph").value,
   ambulance_phone: $("am").value,
   lat: $("lat").value,
   lng: $("lng").value,
   services: [...document.querySelectorAll(".svc:checked")].map(c => c.value)
  });
  btn.disabled = false; btn.textContent = "Save and confirm update";
  if (res.status === 401) { location = "login.html"; return; }
  if (!res.ok) { $("failed").textContent = res.data.error || "Could not save"; $("failed").classList.remove("d-none"); return; }
  h = res.data; show(); $("saved").classList.remove("d-none");
 });
 $("loc").addEventListener("click", async () => {
  try { const pos = await getPosition(5); $("lat").value = pos.lat; $("lng").value = pos.lng; $("locmsg").textContent = "Filled in. Press Save to keep it."; }
  catch (e) { $("locmsg").textContent = e.message; }
 });
</script>

<div id="foot"></div></body></html>
