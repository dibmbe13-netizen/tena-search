<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Emergency</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="alert alert-emergency py-3 mb-0"><div class="container fw-semibold">
 In a life-threatening situation, call your national emergency number first.</div></div>
<div class="container py-4">
 <h1 class="h3 mb-1">Hospitals with emergency care open</h1>
 <p class="text-muted mb-3">Tap a button to call that hospital's ambulance.</p>
 <div class="mb-4"><button id="loc" class="btn btn-outline-danger btn-sm">Use my location to show the closest first</button> <span id="locmsg" class="small text-muted"></span></div>
 <div id="list" class="row g-3"><p class="text-muted">Loading hospitals...</p></div>
</div>
<script>
 function load() { api.emergency().then(list => {
  const box = document.getElementById("list");
  if (list === null && box.dataset.loaded) return; // keep the last good list if a refresh fails
  box.dataset.loaded = "1";
  box.innerHTML = list === null
  ? `<p class="text-danger fw-semibold">Could not load hospitals. Call your national emergency number now.</p>`
  : list.length ? list.map(h => `
   <div class="col-md-6"><div class="card h-100"><div class="card-body">
    <div class="d-flex justify-content-between gap-2 mb-1"><h2 class="h5">${esc(h.name)}</h2>${freshBadge(h.last_updated)}</div>
    <p class="text-muted">${esc(h.address || h.city)}${h.distance_km != null ? " (" + h.distance_km + " km away)" : ""}</p>
    <a class="btn btn-danger btn-lg w-100" href="tel:${esc(h.ambulance_phone || h.phone)}">${esc(h.ambulance_phone ? "Call ambulance " + h.ambulance_phone : "Call hospital " + h.phone)}</a>
    ${h.ambulance_phone ? "" : '<p class="small text-muted mt-2 mb-0">No ambulance number listed for this hospital.</p>'}
    ${h.lat != null ? `<a class="btn btn-outline-secondary w-100 mt-2" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}">Directions</a>` : ""}
   </div></div></div>`).join("")
  : `<p>No hospital has reported emergency care open. Call your national emergency number.</p>`;
 }); }
 document.getElementById("loc").addEventListener("click", async () => {
  const msg = document.getElementById("locmsg");
  try { await askLocation(); msg.textContent = "Sorted with the closest and most recently updated first."; load(); }
  catch (e) { msg.textContent = e.message; }
 });
 if (savedLocation()) document.getElementById("locmsg").textContent = "Sorted with the closest and most recently updated first.";
 load();
 setInterval(load, 30000); // keep the page fresh
</script>

<div id="foot"></div></body></html>
