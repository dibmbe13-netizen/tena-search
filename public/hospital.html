<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Hospital details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-4" id="box"><p class="text-muted">Loading...</p></div>
<script>
 const id = new URLSearchParams(location.search).get("id");
 api.hospital(id).then(h => {
  const box = document.getElementById("box");
  if (!h) { box.innerHTML = `<p>Hospital not found. <a href="search.html">Back to search</a></p>`; return; }
  box.innerHTML = `
   <a href="search.html" class="small">Back to results</a>
   <div class="d-flex flex-wrap justify-content-between gap-2 mt-2"><h1 class="h3">${esc(h.name)}</h1>${freshBadge(h.last_updated)}</div>
   <p class="text-muted">${esc(h.address || h.city)}</p>
   <div class="d-flex flex-wrap gap-2 mb-4">
    <a class="btn btn-primary" href="tel:${esc(h.phone)}">Call ${esc(h.phone)}</a>
    ${h.emergency_open ? `<a class="btn btn-danger" href="tel:${esc(h.ambulance_phone || h.phone)}">${esc(h.ambulance_phone ? "Call ambulance " + h.ambulance_phone : "Emergency: call hospital")}</a>` : ""}
    ${h.lat != null ? `<a class="btn btn-outline-secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}">Directions</a>` : ""}
   </div>
   <h2 class="h5">Services today</h2>
   <table class="table bg-white"><tbody>${ALL_SERVICES.map(s => `<tr><td>${s}</td><td>${
     h.services.includes(s) ? '<span class="badge text-bg-success">Available</span>' : '<span class="badge text-bg-secondary">Not available</span>'}</td></tr>`).join("")}</tbody></table>`;
 });
</script>

<div id="foot"></div></body></html>
