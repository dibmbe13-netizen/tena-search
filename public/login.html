<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Hospital login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-5" style="max-width:420px">
 <h1 class="h3 mb-3">Hospital login</h1>
 <div id="err" class="alert alert-danger d-none"></div>
 <form id="f"><div class="mb-3"><label class="form-label" for="e">Email</label><input id="e" type="email" autocomplete="username" class="form-control" required></div>
  <div class="mb-3"><label class="form-label" for="p">Password</label><div class="input-group"><input id="p" type="password" autocomplete="current-password" class="form-control" required>
   <button type="button" id="toggle" class="btn btn-outline-secondary" aria-label="Show password" aria-pressed="false">Show</button></div></div>
  <button class="btn btn-primary w-100">Log in</button></form>
 <p class="mt-3 small">No account? <a href="register.html">Register your hospital</a></p>
</div>
<script>
 wirePasswordToggle("p", "toggle");
 document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const res = await fetch("/api/auth/login", {
   method: "POST",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify({ email: document.getElementById("e").value, password: document.getElementById("p").value })
  });
  const data = await res.json();
  if (!res.ok) {
   const err = document.getElementById("err");
   err.textContent = data.error; err.classList.remove("d-none");
   return;
  }
  location = data.role === "admin" ? "admin.html" : "dashboard.html";
 });
</script>

<div id="foot"></div></body></html>
