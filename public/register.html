<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Register hospital</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-5" style="max-width:560px">
 <h1 class="h3 mb-3">Register your hospital</h1>
 <div id="err" class="alert alert-danger d-none"></div>
 <div id="done" class="alert alert-success d-none">Request sent. We will approve your hospital after checking the details.</div>
 <form id="f" class="row g-3">
  <div class="col-12"><label class="form-label" for="n">Hospital name</label><input id="n" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label" for="c">City</label><input id="c" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label" for="a">Address</label><input id="a" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label" for="ph">Phone</label><input id="ph" type="tel" class="form-control" required></div>
  <div class="col-md-6"><label class="form-label" for="am">Ambulance phone</label><input id="am" type="tel" class="form-control" required></div>
  <div class="col-12"><label class="form-label" for="e">Data specialist email</label><input id="e" type="email" class="form-control" required></div>
  <div class="col-12"><label class="form-label" for="p">Password</label>
   <div class="input-group"><input id="p" type="password" minlength="8" autocomplete="new-password" class="form-control" required>
   <button type="button" id="toggle" class="btn btn-outline-secondary" aria-label="Show password" aria-pressed="false">Show</button></div></div>
  <div class="col-md-6"><label class="form-label" for="lat">Latitude</label><input id="lat" type="number" step="any" min="-90" max="90" class="form-control" placeholder="e.g. 9.0201" required></div>
  <div class="col-md-6"><label class="form-label" for="lng">Longitude</label><input id="lng" type="number" step="any" min="-180" max="180" class="form-control" placeholder="e.g. 38.7499" required></div>
  <div class="col-12"><button type="button" id="loc" class="btn btn-outline-secondary btn-sm">Fill from this device's location</button> <span id="locmsg" class="small text-muted">Or in Google Maps, right-click your hospital and click the two numbers. Latitude is the first one.</span></div>
  <div class="col-12"><button class="btn btn-primary w-100" id="send">Send registration</button></div>
 </form>
</div>
<script>
 const $ = id => document.getElementById(id);
 wirePasswordToggle("p", "toggle");
 $("loc").addEventListener("click", async () => {
  try { const pos = await getPosition(5); $("lat").value = pos.lat; $("lng").value = pos.lng; $("locmsg").textContent = "Filled in from this device."; }
  catch (e) { $("locmsg").textContent = e.message; }
 });
 $("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("send");
  btn.disabled = true;
  const res = await fetch("/api/auth/register", {
   method: "POST",
   headers: { "Content-Type": "application/json" },
   body: JSON.stringify({ name: $("n").value, city: $("c").value, address: $("a").value,
    phone: $("ph").value, ambulance_phone: $("am").value, email: $("e").value, password: $("p").value, lat: $("lat").value, lng: $("lng").value })
  });
  const data = await res.json();
  btn.disabled = false;
  if (!res.ok) { $("err").textContent = data.error; $("err").classList.remove("d-none"); return; }
  $("err").classList.add("d-none");
  e.target.classList.add("d-none");
  $("done").classList.remove("d-none");
 });
</script>

<div id="foot"></div></body></html>
