<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Find which hospitals offer MRI, CT, X-ray and emergency care right now, and when they last updated.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"><title>Find services</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script><script src="js/api.js"></script></head><body>
<div id="nav"></div>
<div class="container py-4">
 <h1 class="h3 mb-3">Find a service</h1>
 <form id="f" class="row g-2 align-items-center mb-4">
  <div class="col-md-4"><select id="service" class="form-select" aria-label="Service"><option value="">Any service</option></select></div>
  <div class="col-md-3"><input id="city" class="form-control" placeholder="City" aria-label="City"></div>
  <div class="col-md-auto form-check ms-2"><input type="checkbox" id="open" class="form-check-input"><label for="open" class="form-check-label">Emergency open</label></div>
  <div class="col-md-auto"><button class="btn btn-primary">Search</button></div>
  <div class="col-md-auto"><button type="button" id="loc" class="btn btn-outline-secondary">Use my location</button></div>
 </form>
 <p id="locmsg" class="small text-muted mb-3"></p>
 <div id="results" class="row g-3"><p class="text-muted">Loading hospitals...</p></div>
</div>
<script>
 const p = new URLSearchParams(location.search);
 ALL_SERVICES.forEach(s => document.getElementById("service").add(new Option(s, s)));
 document.getElementById("service").value = p.get("service") || "";
 document.getElementById("city").value = p.get("city") || "";
 document.getElementById("open").checked = p.get("open") === "1";

 const card = h => `<div class="col-md-6"><div class="card h-100"><div class="card-body">
  <div class="d-flex justify-content-between gap-2"><h2 class="h5">${esc(h.name)}</h2>${freshBadge(h.last_updated)}</div>
  <p class="text-muted mb-2">${esc(h.city)}${h.distance_km != null ? ", " + h.distance_km + " km away" : ""}${h.emergency_open ? ", emergency open" : ""}</p>
  <p>${h.services.map(s => `<span class="badge text-bg-light border me-1">${s}</span>`).join("")}</p>
  <a class="btn btn-primary btn-sm" href="hospital.html?id=${h.id}">View details</a>
  <a class="btn btn-outline-secondary btn-sm" href="tel:${esc(h.phone)}">Call ${esc(h.phone)}</a>
 </div></div></div>`;

 async function search() {
  const service = document.getElementById("service").value;
  const city = document.getElementById("city").value;
  const open = document.getElementById("open").checked;
  const q = new URLSearchParams();
  if (service) q.set("service", service);
  if (city) q.set("city", city);
  if (open) q.set("open", "1");
  history.replaceState(null, "", q.toString() ? "?" + q : location.pathname); // a refresh keeps your filters
  const list = await api.hospitals({ service, city, open });
  document.getElementById("results").innerHTML = list === null
   ? `<p class="text-danger">Could not load hospitals. Check your connection and try again.</p>`
   : list.length ? list.map(card).join("")
   : `<p class="text-muted">No hospitals match. Try another service or city.</p>`;
 }
 document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); search(); });
 const msg = document.getElementById("locmsg");
 msg.textContent = savedLocation()
  ? "Sorted by how recently hospitals updated and how close they are."
  : "Sorted by how recently hospitals updated. Share your location to also sort by distance. It is used only to sort and is not saved.";
 document.getElementById("loc").addEventListener("click", async () => {
  try { await askLocation(); msg.textContent = "Sorted by how recently hospitals updated and how close they are."; search(); }
  catch (e) { msg.textContent = e.message; }
 });
 search();
</script>

<div id="foot"></div></body></html>
